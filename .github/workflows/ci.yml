name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: EditMode tests (Unity 2022.3.22f1)
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2022.3.22f1-base-3
    permissions:
      contents: read
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      LICENSING_CLIENT: /opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ci/TestProject/Library
          key: Library-2022.3.22f1-${{ hashFiles('jp.colloid.uitk-font-fix/**/*.asmdef', 'ci/TestProject/Packages/manifest.json') }}
          restore-keys: |
            Library-2022.3.22f1-

      - name: Activate Unity license (personal seat via credentials)
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::UNITY_EMAIL / UNITY_PASSWORD repository secrets are not set (verification account credentials)."
            exit 1
          fi
          "$LICENSING_CLIENT" --activate-all --include-personal \
            --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"

      - name: Run EditMode tests
        run: |
          mkdir -p test-results
          /opt/unity/Editor/Unity -batchmode -nographics \
            -projectPath ci/TestProject \
            -runTests -testPlatform EditMode \
            -testResults "$GITHUB_WORKSPACE/test-results/results.xml" \
            -logFile "$GITHUB_WORKSPACE/test-results/tests.log"

      - name: Summarize results
        if: always()
        run: |
          if [ -f test-results/results.xml ]; then
            head -c 400 test-results/results.xml | tr '\n' ' ' | grep -oE 'total="[0-9]+" passed="[0-9]+" failed="[0-9]+" inconclusive="[0-9]+" skipped="[0-9]+"' || true
          else
            echo "no results.xml produced (see tests.log artifact)"
          fi

      - name: Return license seat
        if: always()
        run: |
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            "$LICENSING_CLIENT" --deactivate-all \
              --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

  release:
    name: Tag and release on version change
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release when the package version has no tag yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(jq -r .version jp.colloid.uitk-font-fix/package.json)"
          TAG="v${VERSION}"
          echo "package version: ${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists; nothing to release"
            exit 0
          fi
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "UITK Font Fix ${VERSION}" \
            --generate-notes \
            --notes "UPM install (version pinned): https://github.com/${GITHUB_REPOSITORY}.git?path=jp.colloid.uitk-font-fix#${TAG} -- changes: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/jp.colloid.uitk-font-fix/CHANGELOG.md"
